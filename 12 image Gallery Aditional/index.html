<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery">
        <h1>My Image Gallery</h1>
        <div class="gallery-container">

  <div class="image-card">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
         alt="Nature">
  </div>

  <div class="image-card">
    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
         alt="Mountain">
  </div>

  <div class="image-card">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600"
         alt="Beach">
  </div>

  <div class="image-card">
    <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600"
         alt="Sunset">
  </div>

  <div class="image-card">
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
         alt="Forest">
  </div>

  <div class="image-card">
    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
         alt="Snowy Mountains">
  </div>

</div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="close-btn">&times;</button>
        <img id="preview-image" src="" alt="Image Preview">
    </div>

    <script src="script.js"></script>
</body>
</html>
